# Pull-request labeler (https://github.com/actions/labeler).
# Labels are inferred from changed file paths.

src:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/CaeriusNet/**'
          - 'src/CaeriusNet.Redis/**'
          - 'src/CaeriusNet.Aspire/**'
          - 'src/CaeriusNet.Contracts/**'

source-generator:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/Compiler/CaeriusNet.Generator/**'
          - 'src/Compiler/CaeriusNet.Analyzer/**'
          - 'src/Compiler/CaeriusNet.MultiResultApiGenerator/**'
          - 'src/Compiler/Shared/**'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**'

integration-tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/CaeriusNet.IntegrationTests/**'

benchmarks:
  - changed-files:
      - any-glob-to-any-file:
          - 'benchmarks/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/dependabot.yml'
          - '.github/labeler.yml'

devcontainer:
  - changed-files:
      - any-glob-to-any-file:
          - '.devcontainer/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.csproj'
          - '**/Directory.*.props'
          - '**/Directory.*.targets'
          - '.config/dotnet-tools.json'

governance:
  - changed-files:
      - any-glob-to-any-file:
          - 'CODE_OF_CONDUCT.md'
          - 'CONTRIBUTING.md'
          - 'SECURITY.md'
          - 'SUPPORT.md'
          - '.github/PULL_REQUEST_TEMPLATE.md'
          - '.github/ISSUE_TEMPLATE/**'
