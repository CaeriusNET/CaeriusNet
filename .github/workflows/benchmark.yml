name: CaeriusNet benchmarks

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      category:
        description: 'Benchmark category'
        required: true
        default: all
        type: choice
        options:
          - all
          - command
          - tvp
          - materialization
          - multi-result
          - cache
          - sql-server
          - redis
          - generator
      mode:
        description: 'Run one category, compare the full suite, or record a full-suite candidate baseline artifact.'
        required: true
        default: compare
        type: choice
        options:
          - run
          - compare
          - record
      baseline_version:
        description: 'Committed release baseline to compare (for example 11.2.0).'
        required: true
        default: 11.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: caeriusnet-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  benchmark:
    name: ${{ inputs.category || 'all' }} (${{ inputs.mode || (github.event_name == 'pull_request' && 'run') || 'compare' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Capture SDK for the benchmark environment manifest
        run: echo "CAERIUS_BENCHMARK_SDK_VERSION=$(dotnet --version)" >> "$GITHUB_ENV"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-bench-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/packages.lock.json') }}
          restore-keys: nuget-bench-${{ runner.os }}-

      - name: Resolve benchmark mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MODE="$REQUESTED_MODE"
          if [ -z "$MODE" ]; then
            if [ "$EVENT_NAME" = 'pull_request' ]; then
              MODE='run'
            else
              MODE='compare'
            fi
          fi
          echo "value=$MODE" >> "$GITHUB_OUTPUT"

      - name: Restore benchmark dependencies
        run: dotnet restore benchmarks/CaeriusNet.Benchmark.csproj --locked-mode

      - name: Build benchmark runner
        run: dotnet build benchmarks/CaeriusNet.Benchmark.csproj --configuration Release --no-restore

      - name: Run benchmarks
        id: run
        env:
          CI: 'true'
          BENCHMARK_ARTIFACTS_PATH: ${{ runner.temp }}/caeriusnet-benchmarks
        run: |
          CATEGORY="${{ inputs.category || 'all' }}"
          echo "Running benchmark category: ${CATEGORY}"
          dotnet run --project benchmarks/CaeriusNet.Benchmark.csproj --configuration Release --no-build -- "${CATEGORY}"

          RESULTS="$BENCHMARK_ARTIFACTS_PATH/results"
          test -d "$RESULTS"
          test -n "$(find "$RESULTS" -type f -name '*-report-full*.json' -print -quit)"
          # This records checksums for reports that BenchmarkDotNet has already declared successful. It does not
          # create a synthetic timing baseline, and compare/record reject a result set without this manifest.
          dotnet run --project benchmarks/CaeriusNet.Benchmark.csproj --configuration Release --no-build -- \
            --write-environment "$RESULTS" "$CATEGORY"
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"

      - name: Validate baseline version input
        if: steps.mode.outputs.value != 'run'
        id: baseline
        run: |
          VERSION="${{ inputs.baseline_version || '11.2.0' }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "baseline_version must be a version such as 11.2.0; got '$VERSION'." >&2
            exit 64
          fi
          echo "directory=$GITHUB_WORKSPACE/benchmarks/baselines/$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate comparison scope
        if: steps.mode.outputs.value != 'run'
        run: |
          CATEGORY="${{ inputs.category || 'all' }}"
          if [ "$CATEGORY" != 'all' ]; then
            echo "Baseline compare/record requires category=all so every benchmark identity is measured." >&2
            echo "Use mode=run for an exploratory single-category execution." >&2
            exit 64
          fi

      - name: Compare with the committed baseline
        if: steps.mode.outputs.value == 'compare'
        env:
          BASELINE_DIRECTORY: ${{ steps.baseline.outputs.directory }}
          CANDIDATE_DIRECTORY: ${{ steps.run.outputs.results }}
        run: |
          # A missing baseline is intentionally an error. Bootstrap it with workflow_dispatch mode=record,
          # review the measured reports and caerius-benchmark-environment.v1.json, then commit them under
          # benchmarks/baselines/11.2.0. The comparator rejects a different runner/runtime/job fingerprint.
          dotnet run --project benchmarks/CaeriusNet.Benchmark.csproj --configuration Release --no-build -- \
            --compare "$BASELINE_DIRECTORY" "$CANDIDATE_DIRECTORY" --max-time-regression 5

      - name: Record candidate baseline
        if: steps.mode.outputs.value == 'record'
        id: record
        env:
          CANDIDATE_DIRECTORY: ${{ steps.run.outputs.results }}
          BASELINE_CANDIDATE_DIRECTORY: ${{ runner.temp }}/caeriusnet-baseline
        run: |
          dotnet run --project benchmarks/CaeriusNet.Benchmark.csproj --configuration Release --no-build -- \
            --record-baseline "$CANDIDATE_DIRECTORY" "$BASELINE_CANDIDATE_DIRECTORY"
          echo "directory=$BASELINE_CANDIDATE_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Publish comparison summary
        if: always()
        env:
          RESULTS_DIRECTORY: ${{ steps.run.outputs.results }}
        run: |
          REPORT="$RESULTS_DIRECTORY/caerius-benchmark-comparison.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison report was produced (record mode or an early baseline validation failure)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-reports-${{ github.run_number }}
          path: ${{ steps.run.outputs.results }}
          retention-days: 90
          if-no-files-found: warn

      - name: Upload baseline candidate
        if: always() && steps.mode.outputs.value == 'record'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-baseline-candidate-${{ github.run_number }}
          path: ${{ steps.record.outputs.directory }}
          retention-days: 90
          if-no-files-found: warn
