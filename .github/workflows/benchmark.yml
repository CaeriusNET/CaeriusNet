name: CaeriusNet benchmarks

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      category:
        description: 'Benchmark category'
        required: true
        default: all
        type: choice
        options:
          - all
          - command
          - tvp
          - materialization
          - cache
      mode:
        description: 'Run one category, compare the full suite, or record a full-suite candidate baseline artifact.'
        required: true
        default: compare
        type: choice
        options:
          - run
          - compare
          - record
      baseline_version:
        description: 'Committed release baseline to compare (for example 12.0.0).'
        required: true
        default: 12.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: caeriusnet-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  benchmark:
    name: ${{ inputs.category || 'all' }} (${{ inputs.mode || 'compare' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-bench-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/packages.lock.json') }}
          restore-keys: nuget-bench-${{ runner.os }}-

      - name: Restore benchmark dependencies
        run: dotnet restore benchmarks/CaeriusNet.Benchmark.csproj --locked-mode

      - name: Build benchmark runner
        run: dotnet build benchmarks/CaeriusNet.Benchmark.csproj --configuration Release --no-restore

      - name: Run benchmarks
        id: run
        env:
          CI: 'true'
          BENCHMARK_ARTIFACTS_PATH: ${{ runner.temp }}/caeriusnet-benchmarks
        run: |
          CATEGORY="${{ inputs.category || 'all' }}"
          echo "Running benchmark category: ${CATEGORY}"
          dotnet run --project benchmarks/CaeriusNet.Benchmark.csproj --configuration Release --no-build -- "${CATEGORY}"

          RESULTS="$BENCHMARK_ARTIFACTS_PATH/results"
          test -d "$RESULTS"
          test -n "$(find "$RESULTS" -type f -name '*-report-full*.json' -print -quit)"
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"

      - name: Validate baseline version input
        if: inputs.mode != 'run'
        id: baseline
        run: |
          VERSION="${{ inputs.baseline_version || '12.0.0' }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "baseline_version must be a version such as 12.0.0; got '$VERSION'." >&2
            exit 64
          fi
          echo "directory=$GITHUB_WORKSPACE/benchmarks/baselines/$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate comparison scope
        if: inputs.mode != 'run'
        run: |
          CATEGORY="${{ inputs.category || 'all' }}"
          if [ "$CATEGORY" != 'all' ]; then
            echo "Baseline compare/record requires category=all so every benchmark identity is measured." >&2
            echo "Use mode=run for an exploratory single-category execution." >&2
            exit 64
          fi

      - name: Compare with the committed baseline
        if: inputs.mode == 'compare' || inputs.mode == ''
        env:
          BASELINE_DIRECTORY: ${{ steps.baseline.outputs.directory }}
          CANDIDATE_DIRECTORY: ${{ steps.run.outputs.results }}
        run: |
          # A missing baseline is intentionally an error. Bootstrap it with workflow_dispatch mode=record,
          # review the artifact, then commit its JSON under benchmarks/baselines/12.0.0.
          dotnet run --project benchmarks/CaeriusNet.Benchmark.csproj --configuration Release --no-build -- \
            --compare "$BASELINE_DIRECTORY" "$CANDIDATE_DIRECTORY" --max-time-regression 5

      - name: Record candidate baseline
        if: inputs.mode == 'record'
        id: record
        env:
          CANDIDATE_DIRECTORY: ${{ steps.run.outputs.results }}
          BASELINE_CANDIDATE_DIRECTORY: ${{ runner.temp }}/caeriusnet-baseline
        run: |
          dotnet run --project benchmarks/CaeriusNet.Benchmark.csproj --configuration Release --no-build -- \
            --record-baseline "$CANDIDATE_DIRECTORY" "$BASELINE_CANDIDATE_DIRECTORY"
          echo "directory=$BASELINE_CANDIDATE_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Publish comparison summary
        if: always()
        env:
          RESULTS_DIRECTORY: ${{ steps.run.outputs.results }}
        run: |
          REPORT="$RESULTS_DIRECTORY/caerius-benchmark-comparison.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison report was produced (record mode or an early baseline validation failure)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-reports-${{ github.run_number }}
          path: ${{ steps.run.outputs.results }}
          retention-days: 90
          if-no-files-found: warn

      - name: Upload baseline candidate
        if: always() && inputs.mode == 'record'
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-baseline-candidate-${{ github.run_number }}
          path: ${{ steps.record.outputs.directory }}
          retention-days: 90
          if-no-files-found: warn
