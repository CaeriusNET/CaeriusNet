name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/CaeriusNet.SqlServer.Contracts/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.config/dotnet-tools.json'
      - '.github/workflows/integration-tests.yml'

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  TESTCONTAINERS_RYUK_DISABLED: 'false'
  CAERIUS_RUN_CONTAINERS: 'true'

jobs:
  integration:
    name: SQL Server ${{ matrix.sql.name }} + Redis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sql:
          - name: '2022-CU26-ubuntu-22.04'
            image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
          - name: '2025-CU7-ubuntu-24.04'
            image: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-24.04

    env:
      CAERIUS_TEST_SQL_IMAGE: ${{ matrix.sql.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Display .NET SDK info
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-integration-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/packages.lock.json') }}
          restore-keys: nuget-integration-${{ runner.os }}-

      - name: Pre-pull database images
        run: |
          docker pull '${{ matrix.sql.image }}'
          docker pull redis:7.4-alpine

      - name: Restore
        run: dotnet restore tests/CaeriusNet.IntegrationTests/CaeriusNet.IntegrationTests.csproj --locked-mode

      - name: Build (Release)
        run: dotnet build tests/CaeriusNet.IntegrationTests/CaeriusNet.IntegrationTests.csproj --configuration Release --no-restore

      - name: Run integration tests
        run: |
          dotnet test --project tests/CaeriusNet.IntegrationTests/CaeriusNet.IntegrationTests.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            --results-directory ./artifacts/integration-results \
            --report-trx \
            --report-trx-filename integration-results.trx \
            --coverage \
            --coverage-output integration.coverage.cobertura.xml \
            --coverage-output-format cobertura

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: integration-results-${{ matrix.sql.name }}
          path: artifacts/integration-results/**/*
          retention-days: 14
          if-no-files-found: warn
