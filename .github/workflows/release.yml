name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet version for all CaeriusNet packages (for example 11.2.0)'
        required: true
        default: '11.2.0'
        type: string
      release_notes:
        description: 'Release notes (leave empty to generate them from commits)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    name: Release to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate release branch and version
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = 'refs/heads/main'
          version='${{ inputs.version }}'
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Display .NET SDK info
        run: dotnet --info

      - name: Set deterministic package timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-release-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/packages.lock.json') }}
          restore-keys: nuget-release-${{ runner.os }}-

      - name: Validate the committed package version
        id: version
        run: |
          set -euo pipefail
          requested='${{ inputs.version }}'
          committed=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -n 1)
          test "$committed" = "$requested"
          test -z "$(git status --porcelain -- Directory.Build.props)"
          echo "value=$requested" >> "$GITHUB_OUTPUT"
          echo "tag=v$requested" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        run: |
          set -euo pipefail
          test -f CHANGELOG.md
          grep -q '^## \[Unreleased\]' CHANGELOG.md

      - name: Restore
        run: dotnet restore CaeriusNet.slnx --locked-mode

      - name: Build (Release)
        run: dotnet build CaeriusNet.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Test unit and compiler projects
        run: |
          set -euo pipefail
          for test_project in \
            tests/CaeriusNet.Tests/CaeriusNet.Tests.csproj \
            tests/CaeriusNet.Analyzer.Tests/CaeriusNet.Analyzer.Tests.csproj \
            tests/CaeriusNet.Generator.Tests/CaeriusNet.Generator.Tests.csproj; do
            test_name=$(basename "$(dirname "$test_project")")
            dotnet test --project "$test_project" \
              --configuration Release \
              --no-restore \
              --no-build \
              --results-directory ./artifacts/test-results \
              --report-trx \
              --report-trx-filename "$test_name.trx" \
              --coverage \
              --coverage-output "$test_name.coverage.cobertura.xml" \
              --coverage-output-format cobertura
          done

      - name: Pack exact release artifacts once
        run: |
          set -euo pipefail
          package_directory="$GITHUB_WORKSPACE/artifacts/packages"
          mkdir -p "$package_directory"
          dotnet pack src/CaeriusNet/CaeriusNet.csproj --configuration Release --no-build --output "$package_directory"
          dotnet pack src/CaeriusNet.Redis/CaeriusNet.Redis.csproj --configuration Release --no-build --output "$package_directory"
          dotnet pack src/CaeriusNet.Aspire/CaeriusNet.Aspire.csproj --configuration Release --no-build --output "$package_directory"
          dotnet pack src/CaeriusNet.Contracts/CaeriusNet.Contracts.csproj --configuration Release --no-build --output "$package_directory"

          repro_directory="$RUNNER_TEMP/caeriusnet-packages-repro"
          mkdir -p "$repro_directory"
          for project in \
            src/CaeriusNet/CaeriusNet.csproj \
            src/CaeriusNet.Redis/CaeriusNet.Redis.csproj \
            src/CaeriusNet.Aspire/CaeriusNet.Aspire.csproj \
            src/CaeriusNet.Contracts/CaeriusNet.Contracts.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output "$repro_directory"
          done
          for artifact in "$package_directory"/*.nupkg "$package_directory"/*.snupkg; do
            cmp --silent "$artifact" "$repro_directory/$(basename "$artifact")"
          done

      - name: Exercise packaging acceptance tests from the exact release artifacts
        run: |
          dotnet test --project tests/CaeriusNet.Packaging.Tests/CaeriusNet.Packaging.Tests.csproj \
            --configuration Release \
            --no-restore \
            --no-build \
            --results-directory ./artifacts/test-results/packaging \
            --report-trx \
            --report-trx-filename packaging-results.trx \
            --coverage \
            --coverage-output packaging.coverage.cobertura.xml \
            --coverage-output-format cobertura

      - name: Validate exact release package layout, symbols and package validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./.github/scripts/ValidatePackage.ps1 `
            -Configuration Release `
            -PackageDirectory "$env:GITHUB_WORKSPACE/artifacts/packages" `
            -OutputDirectory "$env:RUNNER_TEMP/caeriusnet-release-package-validation"

      - name: Verify Source Link for release binaries
        shell: pwsh
        run: |
          & ./.github/scripts/ValidateSourceLink.ps1 `
            -Configuration Release `
            -PackageDirectory "$env:GITHUB_WORKSPACE/artifacts/packages"

      - name: Restore four isolated consumers from the exact release packages
        run: bash ./.github/scripts/ValidatePackageConsumers.sh "$GITHUB_WORKSPACE/artifacts/packages" "$RUNNER_TEMP/caeriusnet-release-consumers"

      - name: Exercise Docker acceptance gates against exact release packages
        env:
          CAERIUS_RUN_CONTAINERS: 'true'
          CAERIUS_PACKAGE_DIRECTORY: ${{ github.workspace }}/artifacts/packages
        run: |
          set -euo pipefail
          package_test_root="$RUNNER_TEMP/caeriusnet-release-package-integration"
          package_lock="$package_test_root/packages.lock.json"
          intermediate_directory="$package_test_root/obj/"
          output_directory="$package_test_root/bin/"
          mkdir -p "$package_test_root"
          export NUGET_PACKAGES="$package_test_root/nuget-packages"
          package_properties=(
            -p:UseCaeriusReleasePackages=true
            -p:CaeriusPackageVersion="${{ steps.version.outputs.value }}"
            -p:RestoreAdditionalProjectSources="$GITHUB_WORKSPACE/artifacts/packages"
            -p:NuGetLockFilePath="$package_lock"
            -p:BaseIntermediateOutputPath="$intermediate_directory"
            -p:BaseOutputPath="$output_directory"
          )
          # The temporary package-consumer graph must be created once before the locked
          # restore can verify it. Keep the two phases explicit: the second restore may
          # not mutate the freshly written lock file.
          dotnet msbuild tests/CaeriusNet.IntegrationTests/CaeriusNet.IntegrationTests.csproj \
            /t:Restore \
            /p:RestoreLockedMode=false \
            "${package_properties[@]}"
          dotnet restore tests/CaeriusNet.IntegrationTests/CaeriusNet.IntegrationTests.csproj \
            "${package_properties[@]}" \
            --locked-mode
          if grep -q '"type": "project"' "$intermediate_directory/project.assets.json"; then
            echo 'Release integration gate must resolve CaeriusNet dependencies from packages, not ProjectReference.' >&2
            exit 1
          fi
          dotnet test --project tests/CaeriusNet.IntegrationTests/CaeriusNet.IntegrationTests.csproj \
            --configuration Release \
            --no-restore \
            "${package_properties[@]}" \
            --results-directory ./artifacts/test-results/integration \
            --report-trx \
            --report-trx-filename integration-results.trx \
            --coverage \
            --coverage-output integration.coverage.cobertura.xml \
            --coverage-output-format cobertura

      - name: Record exact release artifact hashes
        run: |
          set -euo pipefail
          package_directory="$GITHUB_WORKSPACE/artifacts/packages"
          (
            cd "$package_directory"
            sha256sum *.nupkg *.snupkg > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload exact release artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: caeriusnet-release-${{ steps.version.outputs.value }}
          path: artifacts/packages/*
          retention-days: 90
          if-no-files-found: error

      - name: NuGet login (OIDC)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org in dependency order
        run: |
          set -euo pipefail
          package_directory="$GITHUB_WORKSPACE/artifacts/packages"
          version='${{ steps.version.outputs.value }}'
          for package_id in CaeriusNet CaeriusNet.Redis CaeriusNet.Aspire CaeriusNet.Contracts; do
            dotnet nuget push "$package_directory/${package_id}.${version}.nupkg" \
              --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
            dotnet nuget push "$package_directory/${package_id}.${version}.snupkg" \
              --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Publish to GitHub Packages in dependency order
        run: |
          set -euo pipefail
          package_directory="$GITHUB_WORKSPACE/artifacts/packages"
          version='${{ steps.version.outputs.value }}'
          for package_id in CaeriusNet CaeriusNet.Redis CaeriusNet.Aspire CaeriusNet.Contracts; do
            dotnet nuget push "$package_directory/${package_id}.${version}.nupkg" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --skip-duplicate
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          version='${{ steps.version.outputs.value }}'
          assets=(artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/packages/SHA256SUMS)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          elif [ -n "$RELEASE_NOTES" ]; then
            printf '%s' "$RELEASE_NOTES" > release-notes.md
            gh release create "$tag" --title "CaeriusNet $version" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          else
            gh release create "$tag" --title "CaeriusNet $version" --generate-notes --repo "$GITHUB_REPOSITORY" "${assets[@]}"
          fi
